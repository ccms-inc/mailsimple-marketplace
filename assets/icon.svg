<?xml version="1.0" encoding="UTF-8"?>
<!--
  MAILsimple plugin icon — CCMS Hosting.
  Brand mark: the CCMS inverted dot-triangle (red) reading as mail converging
  into an envelope. Colors: CCMS red #ED1C24, charcoal #1B1B1B on white.
  Master is 512x512; scales cleanly to favicon sizes. Export PNGs from this file.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MAILsimple by CCMS Hosting">
  <defs>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect width="512" height="512" fill="#FFFFFF"/>
    <rect width="512" height="512" fill="none" stroke="#ECECEC" stroke-width="4"/>

    <!-- envelope body -->
    <rect x="86" y="150" width="340" height="236" rx="30"
          fill="#FFFFFF" stroke="#1B1B1B" stroke-width="14"/>

    <!-- CCMS inverted dot-triangle (mail converging in) -->
    <g fill="#ED1C24">
      <!-- row 1: 5 dots -->
      <circle cx="164" cy="176" r="17"/>
      <circle cx="210" cy="176" r="17"/>
      <circle cx="256" cy="176" r="17"/>
      <circle cx="302" cy="176" r="17"/>
      <circle cx="348" cy="176" r="17"/>
      <!-- row 2: 4 dots -->
      <circle cx="187" cy="218" r="17"/>
      <circle cx="233" cy="218" r="17"/>
      <circle cx="279" cy="218" r="17"/>
      <circle cx="325" cy="218" r="17"/>
      <!-- row 3: 3 dots -->
      <circle cx="210" cy="260" r="17"/>
      <circle cx="256" cy="260" r="17"/>
      <circle cx="302" cy="260" r="17"/>
      <!-- row 4: 2 dots -->
      <circle cx="233" cy="302" r="17"/>
      <circle cx="279" cy="302" r="17"/>
      <!-- row 5: 1 dot (the point) -->
      <circle cx="256" cy="344" r="17"/>
    </g>
  </g>
</svg>
